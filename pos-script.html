<script>
/**
 * Modern POS System - Frontend JavaScript
 * Handles all client-side functionality including authentication, UI interactions, and API calls
 */

// Global Variables
let currentUser = null;
let products = [];
let cart = [];
let currentTaxRate = 0.0875; // Default 8.75%
let currentSettings = {};

// DOM Elements
const loginModal = document.getElementById('loginModal');
const mainContainer = document.getElementById('mainContainer');
const loading = document.getElementById('loading');

// Initialize Application
document.addEventListener('DOMContentLoaded', function() {
    initializeApp();
    setupEventListeners();
});

/**
 * Initialize the application
 */
function initializeApp() {
    showLoading();
    
    // Check if user is already logged in (using sessionStorage)
    const savedUser = sessionStorage.getItem('posUser');
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showMainApp();
        loadDashboardData();
    } else {
        showLoginModal();
    }
    
    hideLoading();
}

/**
 * Setup event listeners
 */
function setupEventListeners() {
    // Login form
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
    
    // Product search
    document.getElementById('productSearch').addEventListener('input', handleProductSearch);
    
    // Product form
    document.getElementById('addProductForm').addEventListener('submit', handleAddProduct);
    
    // Employee form
    document.getElementById('addEmployeeForm').addEventListener('submit', handleAddEmployee);
    
    // Close modals on clicking outside
    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal(modal.id);
            }
        });
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', handleKeyboardShortcuts);
}

/**
 * Handle keyboard shortcuts
 */
function handleKeyboardShortcuts(e) {
    // Ctrl/Cmd + K for product search
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        if (document.getElementById('pos').classList.contains('active')) {
            document.getElementById('productSearch').focus();
        }
    }
    
    // Escape to close modals
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal.show').forEach(modal => {
            closeModal(modal.id);
        });
    }
}

/**
 * Authentication Functions
 */

/**
 * Handle login form submission
 */
async function handleLogin(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const currentAuthType = document.querySelector('.switch-tab.active').dataset.auth;
    const credential = currentAuthType === 'pin' ? 
        document.getElementById('pin').value : 
        document.getElementById('password').value;
    
    if (!username || !credential) {
        showError(`Please enter both username and ${currentAuthType.toUpperCase()}`);
        return;
    }
    
    // Show loading state
    showLoginLoading(true);
    
    try {
        const result = await callServerFunction('authenticateUser', username, credential, currentAuthType);
        
        if (result.success) {
            currentUser = result.user;
            
            // Handle remember me
            if (document.getElementById('rememberMe').checked) {
                localStorage.setItem('posUser', JSON.stringify(currentUser));
                localStorage.setItem('rememberAuth', 'true');
            } else {
                sessionStorage.setItem('posUser', JSON.stringify(currentUser));
            }
            
            showMainApp();
            loadDashboardData();
            showAlert('Login successful!', 'success');
        } else {
            showError(result.message || 'Invalid credentials');
        }
    } catch (error) {
        console.error('Login error:', error);
        showError('Login failed. Please try again.');
    }
    
    showLoginLoading(false);
}

/**
 * Switch between PIN and Password authentication
 */
function switchAuthType(type) {
    // Update tab appearance
    document.querySelectorAll('.switch-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    document.querySelector(`[data-auth="${type}"]`).classList.add('active');
    
    // Show/hide appropriate fields
    document.getElementById('pinField').classList.toggle('hidden', type !== 'pin');
    document.getElementById('passwordField').classList.toggle('hidden', type !== 'password');
    
    // Clear the inactive field
    if (type === 'pin') {
        document.getElementById('password').value = '';
    } else {
        document.getElementById('pin').value = '';
    }
    
    // Focus the active field
    setTimeout(() => {
        const activeField = type === 'pin' ? 'pin' : 'password';
        document.getElementById(activeField).focus();
    }, 100);
}

/**
 * Toggle PIN pad visibility
 */
function togglePinPad() {
    const pinPad = document.getElementById('pinPad');
    pinPad.classList.toggle('hidden');
    
    if (!pinPad.classList.contains('hidden')) {
        document.getElementById('pinPadDisplay').value = '';
    }
}

/**
 * Close PIN pad
 */
function closePinPad() {
    document.getElementById('pinPad').classList.add('hidden');
}

/**
 * Add digit to PIN pad
 */
function addPinDigit(digit) {
    const display = document.getElementById('pinPadDisplay');
    if (display.value.length < 6) {
        display.value += digit;
    }
}

/**
 * Clear PIN pad
 */
function clearPin() {
    document.getElementById('pinPadDisplay').value = '';
}

/**
 * Backspace on PIN pad
 */
function backspacePin() {
    const display = document.getElementById('pinPadDisplay');
    display.value = display.value.slice(0, -1);
}

/**
 * Use PIN pad value
 */
function usePinPadValue() {
    const pinValue = document.getElementById('pinPadDisplay').value;
    if (pinValue) {
        document.getElementById('pin').value = pinValue;
        closePinPad();
    }
}

/**
 * Toggle password visibility
 */
function togglePasswordVisibility() {
    const passwordField = document.getElementById('password');
    const toggleBtn = document.querySelector('.show-password-btn i');
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleBtn.className = 'fas fa-eye-slash';
    } else {
        passwordField.type = 'password';
        toggleBtn.className = 'fas fa-eye';
    }
}

/**
 * Show forgot credentials modal
 */
function showForgotModal() {
    showAlert('Please contact your system administrator to reset your credentials.', 'warning');
}

/**
 * Show/hide login loading state
 */
function showLoginLoading(show) {
    const btn = document.querySelector('.login-btn');
    const btnText = btn.querySelector('.btn-text');
    const btnLoader = btn.querySelector('.btn-loader');
    
    if (show) {
        btnText.classList.add('hidden');
        btnLoader.classList.remove('hidden');
        btn.disabled = true;
    } else {
        btnText.classList.remove('hidden');
        btnLoader.classList.add('hidden');
        btn.disabled = false;
    }
}

/**
 * Load company branding from settings
 */
async function loadCompanyBranding() {
    try {
        const companyName = await callServerFunction('getSetting', 'COMPANY_NAME');
        const companyTagline = await callServerFunction('getSetting', 'COMPANY_TAGLINE');
        
        if (companyName) {
            document.getElementById('companyName').textContent = companyName;
        }
        
        if (companyTagline) {
            document.querySelector('.company-tagline').textContent = companyTagline;
        }
    } catch (error) {
        console.log('Using default branding');
    }
}

/**
 * Logout user
 */
function logout() {
    currentUser = null;
    cart = [];
    sessionStorage.removeItem('posUser');
    showLoginModal();
    showAlert('Logged out successfully', 'success');
}

/**
 * UI Functions
 */

/**
 * Show login modal
 */
function showLoginModal() {
    loginModal.style.display = 'flex';
    mainContainer.style.display = 'none';
    document.getElementById('username').focus();
}

/**
 * Show main application
 */
function showMainApp() {
    loginModal.style.display = 'none';
    mainContainer.style.display = 'block';
    
    // Update user info
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    
    userName.textContent = currentUser.name;
    userAvatar.textContent = currentUser.name.charAt(0).toUpperCase();
    
    // Hide admin-only elements based on role
    const adminElements = document.querySelectorAll('.admin-only');
    adminElements.forEach(element => {
        if (currentUser.role !== 'Admin') {
            element.style.display = 'none';
        }
    });
    
    // Load initial data
    loadProducts();
    loadSettings();
}

/**
 * Show loading spinner
 */
function showLoading() {
    loading.style.display = 'flex';
}

/**
 * Hide loading spinner
 */
function hideLoading() {
    loading.style.display = 'none';
}

/**
 * Show error message
 */
function showError(message) {
    const errorElement = document.getElementById('errorMessage');
    errorElement.textContent = message;
    errorElement.style.display = 'block';
    
    setTimeout(() => {
        errorElement.style.display = 'none';
    }, 5000);
}

/**
 * Show alert
 */
function showAlert(message, type = 'success') {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type}`;
    alertDiv.textContent = message;
    
    // Insert at the top of main content
    const mainContent = document.querySelector('.main-content');
    mainContent.insertBefore(alertDiv, mainContent.firstChild);
    
    // Auto remove after 5 seconds
    setTimeout(() => {
        if (alertDiv.parentNode) {
            alertDiv.parentNode.removeChild(alertDiv);
        }
    }, 5000);
}

/**
 * Navigation Functions
 */

/**
 * Show section
 */
function showSection(sectionName) {
    // Hide all sections
    document.querySelectorAll('.content-section').forEach(section => {
        section.classList.remove('active');
    });
    
    // Remove active class from nav items
    document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
    });
    
    // Show selected section
    document.getElementById(sectionName).classList.add('active');
    
    // Add active class to nav item
    document.querySelector(`[data-section="${sectionName}"]`).classList.add('active');
    
    // Load section-specific data
    switch (sectionName) {
        case 'dashboard':
            loadDashboardData();
            break;
        case 'pos':
            loadProducts();
            break;
        case 'products':
            loadProductsTable();
            break;
        case 'sales':
            loadSalesData();
            break;
        case 'reports':
            initializeReports();
            break;
        case 'employees':
            loadEmployeesTable();
            break;
        case 'settings':
            loadSettings();
            break;
    }
}

/**
 * Data Loading Functions
 */

/**
 * Load dashboard data
 */
async function loadDashboardData() {
    try {
        showLoading();
        
        // Load dashboard statistics
        const [productsResult, salesResult] = await Promise.all([
            callServerFunction('getProducts'),
            callServerFunction('getSalesReports', new Date(Date.now() - 30*24*60*60*1000), new Date())
        ]);
        
        if (productsResult.success) {
            document.getElementById('totalProducts').textContent = productsResult.products.length;
        }
        
        if (salesResult.success) {
            const today = new Date().toDateString();
            const todaySales = salesResult.sales.filter(sale => 
                new Date(sale.date).toDateString() === today
            );
            
            const todayTotal = todaySales.reduce((sum, sale) => sum + (sale.total || 0), 0);
            const monthTotal = salesResult.summary.totalSales || 0;
            
            document.getElementById('todaySales').textContent = `$${todayTotal.toFixed(2)}`;
            document.getElementById('monthRevenue').textContent = `$${monthTotal.toFixed(2)}`;
        }
        
        // Load recent activity (placeholder)
        document.getElementById('recentActivity').innerHTML = `
            <div style="color: #666;">
                <p><i class="fas fa-clock"></i> System initialized successfully</p>
                <p><i class="fas fa-user"></i> ${currentUser.name} logged in</p>
                <p><i class="fas fa-chart-line"></i> Dashboard data loaded</p>
            </div>
        `;
        
    } catch (error) {
        console.error('Error loading dashboard:', error);
        showAlert('Error loading dashboard data', 'error');
    } finally {
        hideLoading();
    }
}

/**
 * Load products
 */
async function loadProducts() {
    try {
        const result = await callServerFunction('getProducts');
        
        if (result.success) {
            products = result.products;
            displayProducts(products);
        } else {
            showAlert('Error loading products', 'error');
        }
    } catch (error) {
        console.error('Error loading products:', error);
        showAlert('Error loading products', 'error');
    }
}

/**
 * Display products in POS grid
 */
function displayProducts(productsToShow) {
    const grid = document.getElementById('productsGrid');
    
    if (!productsToShow || productsToShow.length === 0) {
        grid.innerHTML = '<p style="text-align: center; color: #666; grid-column: 1/-1;">No products found</p>';
        return;
    }
    
    grid.innerHTML = productsToShow.map(product => `
        <div class="product-card" onclick="addToCart('${product.id}')">
            <div class="product-name">${product.name}</div>
            <div class="product-price">$${product.price.toFixed(2)}</div>
            <div class="product-stock">Stock: ${product.stock}</div>
            <div class="product-category">${product.category}</div>
        </div>
    `).join('');
}

/**
 * Load products table
 */
async function loadProductsTable() {
    try {
        showLoading();
        
        const result = await callServerFunction('getProducts');
        
        if (result.success) {
            const tbody = document.querySelector('#productsTable tbody');
            tbody.innerHTML = result.products.map(product => `
                <tr>
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>$${product.price.toFixed(2)}</td>
                    <td>$${product.cost.toFixed(2)}</td>
                    <td>${product.stock}</td>
                    <td>${product.barcode}</td>
                    <td>
                        <button class="btn btn-secondary btn-sm" onclick="editProduct('${product.id}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteProduct('${product.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
    } catch (error) {
        console.error('Error loading products table:', error);
        showAlert('Error loading products', 'error');
    } finally {
        hideLoading();
    }
}

/**
 * Load sales data
 */
async function loadSalesData() {
    try {
        showLoading();
        
        const startDate = document.getElementById('startDate').value ? 
            new Date(document.getElementById('startDate').value) : 
            new Date(Date.now() - 30*24*60*60*1000);
        const endDate = document.getElementById('endDate').value ? 
            new Date(document.getElementById('endDate').value) : 
            new Date();
        
        const result = await callServerFunction('getSalesReports', startDate, endDate);
        
        if (result.success) {
            const tbody = document.querySelector('#salesTable tbody');
            tbody.innerHTML = result.sales.map(sale => `
                <tr>
                    <td>${sale.saleId}</td>
                    <td>${new Date(sale.date).toLocaleDateString()}</td>
                    <td>${sale.productName}</td>
                    <td>${sale.quantity}</td>
                    <td>$${sale.total.toFixed(2)}</td>
                    <td>${sale.employee}</td>
                    <td>${sale.paymentMethod}</td>
                </tr>
            `).join('');
        }
    } catch (error) {
        console.error('Error loading sales data:', error);
        showAlert('Error loading sales data', 'error');
    } finally {
        hideLoading();
    }
}

 * Load employees table

/**
 * Load settings
 */
async function loadSettings() {
    try {
        const taxRate = await callServerFunction('getSetting', 'TAX_RATE');
        const currency = await callServerFunction('getSetting', 'CURRENCY');
        const lowStockThreshold = await callServerFunction('getSetting', 'LOW_STOCK_THRESHOLD');
        const receiptFooter = await callServerFunction('getSetting', 'RECEIPT_FOOTER');
        
        document.getElementById('taxRate').value = taxRate ? parseFloat(taxRate) * 100 : 8.75;
        document.getElementById('currency').value = currency || 'USD';
        document.getElementById('lowStockThreshold').value = lowStockThreshold || 10;
        document.getElementById('receiptFooter').value = receiptFooter || 'Thank you for your business!';
        
        currentTaxRate = taxRate ? parseFloat(taxRate) : 0.0875;
        
    } catch (error) {
        console.error('Error loading settings:', error);
    }
}

/**
 * POS Functions
 */

/**
 * Handle product search
 */
function handleProductSearch(e) {
    const query = e.target.value.toLowerCase();
    
    if (!query) {
        displayProducts(products);
        return;
    }
    
    const filteredProducts = products.filter(product =>
        product.name.toLowerCase().includes(query) ||
        product.category.toLowerCase().includes(query) ||
        product.barcode.includes(query)
    );
    
    displayProducts(filteredProducts);
}

/**
 * Add product to cart
 */
function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    
    if (product.stock <= 0) {
        showAlert('Product is out of stock', 'warning');
        return;
    }
    
    const existingItem = cart.find(item => item.id === productId);
    
    if (existingItem) {
        if (existingItem.quantity < product.stock) {
            existingItem.quantity++;
        } else {
            showAlert('Not enough stock available', 'warning');
            return;
        }
    } else {
        cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            quantity: 1,
            stock: product.stock
        });
    }
    
    updateCartDisplay();
    animateAddToCart();
}

/**
 * Remove from cart
 */
function removeFromCart(productId) {
    cart = cart.filter(item => item.id !== productId);
    updateCartDisplay();
}

/**
 * Update cart quantity
 */
function updateCartQuantity(productId, change) {
    const item = cart.find(item => item.id === productId);
    if (!item) return;
    
    const newQuantity = item.quantity + change;
    
    if (newQuantity <= 0) {
        removeFromCart(productId);
    } else if (newQuantity <= item.stock) {
        item.quantity = newQuantity;
        updateCartDisplay();
    } else {
        showAlert('Not enough stock available', 'warning');
    }
}

/**
 * Update cart display
 */
function updateCartDisplay() {
    const cartItems = document.getElementById('cartItems');
    const checkoutBtn = document.getElementById('checkoutBtn');
    
    if (cart.length === 0) {
        cartItems.innerHTML = `
            <p style="text-align: center; color: #666; margin-top: 50px;">
                <i class="fas fa-shopping-cart" style="font-size: 48px; opacity: 0.3;"></i><br>
                Cart is empty
            </p>
        `;
        checkoutBtn.disabled = true;
    } else {
        cartItems.innerHTML = cart.map(item => `
            <div class="cart-item">
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">$${item.price.toFixed(2)} each</div>
                </div>
                <div class="quantity-controls">
                    <button class="qty-btn" onclick="updateCartQuantity('${item.id}', -1)">
                        <i class="fas fa-minus"></i>
                    </button>
                    <span style="margin: 0 10px; font-weight: 600;">${item.quantity}</span>
                    <button class="qty-btn" onclick="updateCartQuantity('${item.id}', 1)">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="qty-btn" style="background: #dc3545; margin-left: 10px;" onclick="removeFromCart('${item.id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `).join('');
        
        checkoutBtn.disabled = false;
    }
    
    updateCartTotals();
}

/**
 * Update cart totals
 */
function updateCartTotals() {
    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const taxAmount = subtotal * currentTaxRate;
    const discount = 0; // Implement discount logic if needed
    const total = subtotal + taxAmount - discount;
    
    document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
    document.getElementById('taxAmount').textContent = `$${taxAmount.toFixed(2)}`;
    document.getElementById('discountAmount').textContent = `$${discount.toFixed(2)}`;
    document.getElementById('totalAmount').textContent = `$${total.toFixed(2)}`;
}

/**
 * Animate add to cart
 */
function animateAddToCart() {
    // Simple animation feedback
    const cartHeader = document.querySelector('.cart-header');
    cartHeader.style.transform = 'scale(1.05)';
    cartHeader.style.color = '#28a745';
    
    setTimeout(() => {
        cartHeader.style.transform = 'scale(1)';
        cartHeader.style.color = '#333';
    }, 200);
}

/**
 * Modal Functions
 */

/**
 * Open checkout modal
 */
function openCheckoutModal() {
    if (cart.length === 0) return;
    
    const modal = document.getElementById('checkoutModal');
    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const taxAmount = subtotal * currentTaxRate;
    const total = subtotal + taxAmount;
    
    document.getElementById('checkoutSubtotal').textContent = `$${subtotal.toFixed(2)}`;
    document.getElementById('checkoutTax').textContent = `$${taxAmount.toFixed(2)}`;
    document.getElementById('checkoutTotal').textContent = `$${total.toFixed(2)}`;
    
    modal.classList.add('show');
}

/**
 * Open add product modal
 */
function openAddProductModal() {
    document.getElementById('addProductModal').classList.add('show');
    document.getElementById('productName').focus();
}

/**
 * Open add employee modal
 */
function openAddEmployeeModal() {
    document.getElementById('addEmployeeModal').classList.add('show');
    document.getElementById('employeeName').focus();
}

/**
 * Close modal
 */
function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('show');
}

/**
 * Form Handlers
 */

/**
 * Handle add product
 */
async function handleAddProduct(e) {
    e.preventDefault();
    
    const formData = {
        name: document.getElementById('productName').value,
        category: document.getElementById('productCategory').value,
        price: parseFloat(document.getElementById('productPrice').value),
        cost: parseFloat(document.getElementById('productCost').value),
        stock: parseInt(document.getElementById('productStock').value),
        barcode: document.getElementById('productBarcode').value
    };
    
    try {
        showLoading();
        
        const result = await callServerFunction('addProduct', 
            formData.name, formData.price, formData.cost, 
            formData.stock, formData.category, formData.barcode
        );
        
        if (result.success) {
            showAlert('Product added successfully!', 'success');
            closeModal('addProductModal');
            e.target.reset();
            
            // Reload products
            await loadProducts();
            if (document.getElementById('products').classList.contains('active')) {
                await loadProductsTable();
            }
        } else {
            showAlert(result.message || 'Error adding product', 'error');
        }
    } catch (error) {
        console.error('Error adding product:', error);
        showAlert('Error adding product', 'error');
    } finally {
        hideLoading();
    }
}

/**
 * Handle add employee
 */
async function handleAddEmployee(e) {
    e.preventDefault();
    
    const formData = {
        name: document.getElementById('employeeName').value,
        role: document.getElementById('employeeRole').value,
        username: document.getElementById('employeeUsername').value,
        pin: document.getElementById('employeePin').value
    };
    
    try {
        showLoading();
        
        const result = await callServerFunction('addEmployee', 
            formData.name, formData.role, formData.username, formData.pin
        );
        
        if (result.success) {
            showAlert('Employee added successfully!', 'success');
            closeModal('addEmployeeModal');
            e.target.reset();
            
            // Reload employees table if active
            if (document.getElementById('employees').classList.contains('active')) {
                await loadEmployeesTable();

/**
 * Process sale
 */
async function processSale() {
    if (cart.length === 0) return;
    
    const paymentMethod = document.getElementById('paymentMethod').value;
    const saleData = {
        items: cart,
        paymentMethod: paymentMethod,
        employeeId: currentUser.id,
        taxRate: currentTaxRate,
        discount: 0
    };
    
    try {
        showLoading();
        
        const result = await callServerFunction('processSale', saleData);
        
        if (result.success) {
            showAlert(`Sale processed successfully! Total: $${result.total.toFixed(2)}`, 'success');
            
            // Clear cart and close modal
            cart = [];
            updateCartDisplay();
            closeModal('checkoutModal');
            
            // Show receipt modal (placeholder)
            showReceiptModal(result);
            
            // Reload products to update stock
            await loadProducts();
            
        } else {
            showAlert(result.message || 'Error processing sale', 'error');
        }
    } catch (error) {
        console.error('Error processing sale:', error);
        showAlert('Error processing sale', 'error');
    } finally {
        hideLoading();
    }
}

/**
 * Call server function
 */
async function callServerFunction(functionName, ...args) {
    try {
        // Since we're in Apps Script HTML environment, we use google.script.run
        return new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                [functionName](...args);
        });
    } catch (error) {
        console.error('Server call error:', error);
        throw error;
    }
}

/**
 * Switch report tabs
 */
function switchReportTab(reportType) {
    // Update tab appearance
    document.querySelectorAll('.report-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    document.querySelector(`[data-report="${reportType}"]`).classList.add('active');
    
    // Show/hide report content
    document.querySelectorAll('.report-content').forEach(content => {
        content.classList.remove('active');
    });
    document.getElementById(`${reportType}-report`).classList.add('active');
    
    // Update report type selector
    document.getElementById('reportType').value = reportType;
    
    // Load data for the selected report
    loadReportData(reportType);
}

/**
 * Handle report type change from dropdown
 */
function handleReportTypeChange() {
    const reportType = document.getElementById('reportType').value;
    switchReportTab(reportType);
}

 */
function generateSelectedReport() {
    const reportType = document.getElementById('reportType').value;

/**
 * Load report data based on type
 */
async function loadReportData(reportType, date = null) {
    const targetDate = date || new Date().toISOString().split('T')[0];
    
    try {
        switch (reportType) {
            case 'daily-rvc':
                await loadDailyRVCReport(targetDate);
                break;
            case 'weekly-sales':
                await loadWeeklySalesReport(targetDate);
                break;
            case 'monthly-performance':
                await loadMonthlyPerformanceReport(targetDate);
                break;
            case 'product-performance':
                await loadProductPerformanceReport(targetDate);
                break;
            case 'employee-performance':
                await loadEmployeePerformanceReport(targetDate);
                break;
            case 'analytics':
                await loadChartsData();
                break;
        }
    } catch (error) {
        console.error('Error loading report data:', error);
        showAlert('Error loading report data', 'error');
    }
}

/**
 * Load Weekly Sales Report
 */
async function loadWeeklySalesReport(date) {
    try {
        showLoading();
        
        // Calculate week start date (Monday)
        const targetDate = new Date(date);
        const dayOfWeek = targetDate.getDay();
        const weekStartDate = new Date(targetDate);
        weekStartDate.setDate(targetDate.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
        
        const result = await callServerFunction('getWeeklySalesReport', weekStartDate);
        
        if (result.success) {
            const { report } = result;
            
            // Create weekly trend chart
            createWeeklyTrendChart(report.dailyBreakdown);
            
            // Create weekly stats table
            createWeeklyStatsTable(report.dailyBreakdown);
            
            showAlert('Weekly sales report loaded successfully', 'success');

            showAlert('Error loading weekly sales report', 'error');
        }
    } catch (error) {
        console.error('Error loading weekly sales report:', error);
        showAlert('Error loading weekly sales report', 'error');
    } finally {
        hideLoading();
    }
}

function createHourlyRevenueChart(hourlyData) {
    const container = document.getElementById('hourlyRevenueChart');

        <div style="height: 300px; display: flex; align-items: center; justify-content: center; color: #666;">
            <div>
                <i class="fas fa-chart-bar" style="font-size: 48px; opacity: 0.3; margin-bottom: 15px; display: block;"></i>
                <p>Peak Hours: ${findPeakHour(hourlyData)}</p>
                <p>Total Revenue: $${hourlyData.reduce((sum, hour) => sum + hour.revenue, 0).toFixed(2)}</p>
            </div>
        </div>
    `;
}

function createTopProductsChart(topProducts) {
    const container = document.getElementById('topProductsRevenueChart');
    container.innerHTML = `
        <h4>Top Products by Revenue</h4>
        <div style="height: 300px; padding: 20px;">
            ${topProducts.slice(0, 5).map((product, index) => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee;">
                    <span style="font-weight: 500;">${index + 1}. ${product.name}</span>
                    <span style="font-weight: 600; color: #28a745;">$${product.revenue.toFixed(2)}</span>
                </div>
            `).join('')}
        </div>
    `;
}

function createWeeklyTrendChart(dailyBreakdown) {
    const container = document.getElementById('weeklyTrendChart');
    const days = Object.keys(dailyBreakdown).sort();
    
    container.innerHTML = `
        <h4>Daily Sales Trend</h4>
        <div style="height: 300px; padding: 20px;">
            ${days.map(day => {
                const data = dailyBreakdown[day];
                const dayName = new Date(day).toLocaleDateString('en-US', { weekday: 'short' });
                return `
                    <div style="display: flex; justify-content: between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee;">
                        <div style="flex: 1;">
                            <div style="font-weight: 600;">${dayName}</div>
                            <div style="font-size: 12px; color: #666;">${new Date(day).toLocaleDateString()}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 600; color: #28a745;">$${data.revenue.toFixed(2)}</div>
                            <div style="font-size: 12px; color: #666;">${data.transactions} transactions</div>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function createWeeklyStatsTable(dailyBreakdown) {
    const container = document.getElementById('weeklyStatsTable');
    const days = Object.keys(dailyBreakdown).sort();
    
    let totalRevenue = 0;
    let totalTransactions = 0;
    let totalItems = 0;
    
    const tableRows = days.map(day => {
        const data = dailyBreakdown[day];
        totalRevenue += data.revenue;
        totalTransactions += data.transactions;
        totalItems += data.items;
        
        return `
            <tr>
                <td>${new Date(day).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}</td>
                <td>$${data.revenue.toFixed(2)}</td>
                <td>${data.transactions}</td>
                <td>${data.items}</td>
                <td>$${data.transactions > 0 ? (data.revenue / data.transactions).toFixed(2) : '0.00'}</td>
            </tr>
        `;
    }).join('');
    
    container.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Revenue</th>
                    <th>Transactions</th>
                    <th>Items Sold</th>
                    <th>Avg Transaction</th>
                </tr>
            </thead>
            <tbody>
                ${tableRows}
                <tr style="background: #f8f9fa; font-weight: 600;">
                    <td>TOTAL</td>
                    <td>$${totalRevenue.toFixed(2)}</td>
                    <td>${totalTransactions}</td>
                    <td>${totalItems}</td>
                    <td>$${totalTransactions > 0 ? (totalRevenue / totalTransactions).toFixed(2) : '0.00'}</td>
                </tr>
            </tbody>
        </table>
    `;
}

/**
 * Helper Functions
 */
function findPeakHour(hourlyData) {
    let peakHour = hourlyData.reduce((max, hour) => 
        hour.revenue > max.revenue ? hour : max, hourlyData[0]);
    return peakHour.hour;
}
