let currentSessionId = null;
let products = [];
let cart = [];

// DOM Elements (will be set when DOM is ready)

// Initialize Application
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM fully loaded, starting POS initialization...');
    
    // Force hide loading overlay immediately and repeatedly
    function forceHideLoading() {
        const loadingOverlay = document.getElementById('loading');
        if (loadingOverlay) {
            loadingOverlay.style.display = 'none';
            loadingOverlay.style.visibility = 'hidden';
            loadingOverlay.classList.add('hidden');
            console.log('Loading overlay forcefully hidden');
        }
    }
    
    forceHideLoading();
    
    // Force show login modal immediately
    function forceShowLogin() {
        const loginModal = document.getElementById('loginModal');
        if (loginModal) {
            loginModal.style.display = 'flex';
            loginModal.style.visibility = 'visible';
            loginModal.classList.remove('hidden');
            console.log('Login modal forcefully shown');
        }
        
        const mainContainer = document.getElementById('mainContainer');
        if (mainContainer) {
            mainContainer.style.display = 'none';
            console.log('Main container hidden');
        }
    }
    
    forceShowLogin();
    
    // Initialize with multiple attempts
    let initAttempts = 0;
    function attemptInitialization() {
        initAttempts++;
        console.log(`Initialization attempt ${initAttempts}`);
        
        try {
            // Force UI state again
            forceHideLoading();
            forceShowLogin();
            
            // Initialize app
            initializeApp();
            setupEventListeners();
            
            console.log('POS initialization completed successfully');
        } catch (error) {
            console.error(`Error during app initialization (attempt ${initAttempts}):`, error);
            
            if (initAttempts < 3) {
                // Retry after a short delay
                setTimeout(attemptInitialization, 500);
            } else {
                // Show error message after 3 failed attempts
                showDeploymentError();
            }
        }
    }
    
    // Start initialization with a small delay
    setTimeout(attemptInitialization, 100);
});

/**
 * Handle fallback login
 */
async function fallbackLogin() {
    const username = document.getElementById('fallbackUsername').value;
    const pin = document.getElementById('fallbackPin').value;
    const errorDiv = document.getElementById('fallbackError');
    
    if (!username || !pin) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Please enter both username and PIN';
        return;
    }
    
    try {
        errorDiv.style.display = 'none';
        
        // Show loading state
        const button = event.target;
        const originalText = button.textContent;
        button.textContent = 'Signing in...';
        button.disabled = true;
        
        const result = await callServerFunction('authenticateUser', username, pin, 'pin');
        
        if (result.success) {
            currentUser = result.user;
            currentSessionId = result.user.sessionId;
            
            // Store session
            sessionStorage.setItem('posUser', JSON.stringify(currentUser));
            sessionStorage.setItem('currentSessionId', currentSessionId);
            
            // Remove fallback login
            const fallbackEl = document.getElementById('fallbackLogin');
            if (fallbackEl) {
                fallbackEl.remove();
            }
            
            // Force show main app
            showMainApp();
            
        } else {
            button.textContent = originalText;
            button.disabled = false;
            errorDiv.style.display = 'block';
            errorDiv.textContent = result.message || 'Login failed';
        }
        
    } catch (error) {
        console.error('Fallback login error:', error);
        button.textContent = originalText;
        button.disabled = false;
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Login failed. Please try again.';
    }
}

/**
 * Initialize the application
 */
function initializeApp() {
    console.log('Initializing POS application...');
    
    // Initialize DOM elements with better error handling
    loginModal = document.getElementById('loginModal');
    mainContainer = document.getElementById('mainContainer');
    loading = document.getElementById('loading');
    
    console.log('DOM elements found:', {
        loginModal: !!loginModal,
        mainContainer: !!mainContainer,
        loading: !!loading
    });
    
    // Aggressively force proper initial state
    if (loading) {
        loading.style.display = 'none';
        loading.style.visibility = 'hidden';
        loading.style.opacity = '0';
        loading.classList.add('hidden');
        console.log('Loading aggressively hidden in initializeApp');
    }
    
    if (loginModal) {
        loginModal.style.display = 'flex';
        loginModal.style.visibility = 'visible';
        loginModal.style.opacity = '1';
        loginModal.classList.remove('hidden');
        console.log('Login modal aggressively shown in initializeApp');
        
        // Focus username field
        setTimeout(() => {
            const usernameField = document.getElementById('username');
            if (usernameField) {
                usernameField.focus();
                console.log('Username field focused');
            }
        }, 100);
    }
    
    if (mainContainer) {
        mainContainer.style.display = 'none';
        mainContainer.style.visibility = 'hidden';
        console.log('Main container aggressively hidden in initializeApp');
    }
    
    // If critical elements are missing, show error
    if (!loginModal) {
        console.error('Login modal missing! Creating fallback...');
        createFallbackLogin();
        return;
    }
    
    if (!mainContainer) {
        console.error('Main container missing!');
        showDeploymentError();
        return;
    }
    
    // Check if user is already logged in
    const savedUser = sessionStorage.getItem('posUser') || localStorage.getItem('posUser');
    const savedSessionId = sessionStorage.getItem('currentSessionId') || localStorage.getItem('currentSessionId');
    
    if (savedUser && savedSessionId) {
        console.log('Found saved user and session, loading main app...');
        try {
            currentUser = JSON.parse(savedUser);
            currentSessionId = savedSessionId;
            showMainApp();
            loadDashboardData();
            loadCompanyBranding();
        } catch (error) {
            console.error('Error parsing saved user:', error);
            showLoginModal();
            loadCompanyBranding();
        }
    } else {
        console.log('No saved user or session, showing login modal...');
        showLoginModal();
        loadCompanyBranding();
    }
}

/**
 * Setup event listeners
 */
function setupEventListeners() {
    console.log('Setting up event listeners...');
    
    // Login form
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
        loginForm.addEventListener('submit', handleLogin);
    }
    
    // Product search
    const productSearch = document.getElementById('productSearch');
    if (productSearch) {
        productSearch.addEventListener('input', handleProductSearch);
    }
    
    // Product form
    const addProductForm = document.getElementById('addProductForm');
    if (addProductForm) {
        addProductForm.addEventListener('submit', handleAddProduct);
    }
    
    // Employee form
    const addEmployeeForm = document.getElementById('addEmployeeForm');
    if (addEmployeeForm) {
        addEmployeeForm.addEventListener('submit', handleAddEmployee);
    }
    
    // Close modals on clicking outside
    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal(modal.id);
            }
        });
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', handleKeyboardShortcuts);
}

/**
 * Handle keyboard shortcuts
 */
function handleKeyboardShortcuts(e) {
    // Ctrl/Cmd + K for product search
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        if (document.getElementById('pos').classList.contains('active')) {
            document.getElementById('productSearch').focus();
        }
    }
    
    // Escape to close modals
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal.show').forEach(modal => {
            closeModal(modal.id);
        });
    }
}

/**
 * Authentication Functions

/**
 * Handle login form submission
 */
async function handleLogin(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const currentAuthType = document.querySelector('.switch-tab.active').dataset.auth;
    const credential = currentAuthType === 'pin' ? 
        document.getElementById('pin').value : 
        document.getElementById('password').value;
    
    if (!username || !credential) {
        showError(`Please enter both username and ${currentAuthType.toUpperCase()}`);
        return;
    }
    
    // Show loading state
    showLoginLoading(true);
    
    try {
        // Step 1: Authenticating
        updateLoadingProgress(1, 'Authenticating...');
        
        const result = await callServerFunction('authenticateUser', username, credential, currentAuthType);
        
        if (result.success) {
            currentUser = result.user;
            currentSessionId = result.user.sessionId;
            
            // Step 2: Loading Data
            updateLoadingProgress(2, 'Loading Data...');
            
            // Handle remember me
            if (document.getElementById('rememberMe').checked) {
                localStorage.setItem('posUser', JSON.stringify(currentUser));
                localStorage.setItem('currentSessionId', currentSessionId);
                localStorage.setItem('rememberAuth', 'true');
            } else {
                sessionStorage.setItem('posUser', JSON.stringify(currentUser));
                sessionStorage.setItem('currentSessionId', currentSessionId);
            }
            
            // Small delay to show progress
            await new Promise(resolve => setTimeout(resolve, 800));
            
            // Step 3: Ready
            updateLoadingProgress(3, 'Ready!');
            
            // Show main app after brief delay
            setTimeout(() => {
                showMainApp();
                loadDashboardData();
                showAlert('Welcome back, ' + currentUser.name + '!', 'success');
            }, 500);
            
        } else {
            showError(result.message || 'Invalid credentials');
        }
    } catch (error) {
        console.error('Login error:', error);
        showError('Login failed. Please try again.');
    }
    
    showLoginLoading(false);
}

/**
 * Switch between PIN and Password authentication
 */
function switchAuthType(type) {
    // Update tab appearance
    document.querySelectorAll('.switch-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    document.querySelector(`[data-auth="${type}"]`).classList.add('active');
    
    // Show/hide appropriate fields
    document.getElementById('pinField').classList.toggle('hidden', type !== 'pin');
    document.getElementById('passwordField').classList.toggle('hidden', type !== 'password');
    
    // Clear the inactive field
    if (type === 'pin') {
        document.getElementById('password').value = '';
    } else {
        document.getElementById('pin').value = '';
    }
    
    // Focus the active field
    setTimeout(() => {
        const activeField = type === 'pin' ? 'pin' : 'password';
        document.getElementById(activeField).focus();
    }, 100);
}

/**
 * Toggle PIN pad visibility
 */
function togglePinPad() {
    const pinPad = document.getElementById('pinPad');
    pinPad.classList.toggle('hidden');
    
    if (!pinPad.classList.contains('hidden')) {
        document.getElementById('pinPadDisplay').value = '';
    }
}

/**
 * Close PIN pad
 */
function closePinPad() {
    document.getElementById('pinPad').classList.add('hidden');
}

/**
 * Add digit to PIN pad
 */
function addPinDigit(digit) {
    const display = document.getElementById('pinPadDisplay');
    if (display.value.length < 6) {
        display.value += digit;
    }
}

/**
 * Clear PIN pad
 */
function clearPin() {
    document.getElementById('pinPadDisplay').value = '';
}

/**
 * Backspace on PIN pad
 */
function backspacePin() {
    const display = document.getElementById('pinPadDisplay');
    display.value = display.value.slice(0, -1);
}

/**
 * Use PIN pad value
 */
function usePinPadValue() {
    const pinValue = document.getElementById('pinPadDisplay').value;
    if (pinValue) {
        document.getElementById('pin').value = pinValue;
        closePinPad();
    }
}

/**
 * Toggle password visibility
 */
function togglePasswordVisibility() {
    const passwordField = document.getElementById('password');
    const toggleBtn = document.querySelector('.show-password-btn i');
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleBtn.className = 'fas fa-eye-slash';
    } else {
        passwordField.type = 'password';
        toggleBtn.className = 'fas fa-eye';
    }
}

/**
 * Show forgot credentials modal
 */
function showForgotModal() {
    showAlert('Please contact your system administrator to reset your credentials.', 'warning');
}

/**
 * Show/hide login loading state
 */
function showLoginLoading(show) {
    const btn = document.getElementById('loginBtn');
    const btnContent = document.getElementById('btnContent');
    const btnLoader = document.getElementById('btnLoader');
    
    if (btn && btnContent && btnLoader) {
        if (show) {
            btnContent.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            btn.disabled = true;
        } else {
            btnContent.classList.remove('hidden');
            btnLoader.classList.add('hidden');
            btn.disabled = false;
        }
    }
}

/**
 * Load company branding from settings
 */
async function loadCompanyBranding() {
    try {
        console.log('Loading company branding from Google Sheets...');
        
        // Get all company settings at once
        const companySettings = await callServerFunction('getCompanySettings');
        console.log('Company settings loaded:', companySettings);
        
        if (companySettings) {
            // Update login page branding
            const companyNameEl = document.getElementById('companyName');
            const companyTaglineEl = document.querySelector('.company-tagline');
            const companyLogoEl = document.querySelector('.company-logo i');
            
            if (companyNameEl && companySettings.name) {
                companyNameEl.textContent = companySettings.name;
                console.log('Updated company name to:', companySettings.name);
            }
            
            if (companyTaglineEl && companySettings.tagline) {
                companyTaglineEl.textContent = companySettings.tagline;
                console.log('Updated company tagline to:', companySettings.tagline);
            }
            
            if (companyLogoEl && companySettings.logo) {
                companyLogoEl.className = companySettings.logo;
                console.log('Updated company logo to:', companySettings.logo);
            }
            
            // Update all logo elements throughout the app
            const allLogoElements = document.querySelectorAll('.logo-circle i, .company-logo i');
            allLogoElements.forEach(logo => {
                if (companySettings.logo) {
                    logo.className = companySettings.logo;
                }
            });
            
            // Store settings globally for use throughout the app
            window.companySettings = companySettings;
            
            console.log('Company branding updated successfully');
        }
        
    } catch (error) {
        console.error('Error loading company branding:', error);
        // Use fallback values
        window.companySettings = {
            name: 'RetailPro',
            tagline: 'Modern Point of Sale System',
            logo: 'fas fa-store'
        };
    }
}

/**
 * Logout user
 */
async function logout() {
    if (currentSessionId && currentUser) {
        try {
            // End session on server
            await callServerFunction('logoutUser', currentSessionId, currentUser.username);
        } catch (error) {
            console.error('Error ending session:', error);
        }
    }
    
    // Clear user data
    currentUser = null;
    currentSessionId = null;
    cart = [];
    sessionStorage.removeItem('posUser');
    sessionStorage.removeItem('currentSessionId');
    localStorage.removeItem('posUser');
    localStorage.removeItem('currentSessionId');
    localStorage.removeItem('rememberAuth');
    
    showLoginModal();
    showAlert('Logged out successfully', 'success');
}

function showLoading(message = 'Loading...') {

        loading.style.display = 'flex';
        loading.classList.remove('fade-out');

        updateLoadingProgress(1, 'Initializing...');

/**
 * Hide loading overlay with fade effect
 */
function hideLoading() {
    if (loading) {
        loading.classList.add('fade-out');
        setTimeout(() => {
            loading.style.display = 'none';
        }, 500);
    }
}

/**
 * Update loading progress
 */
function updateLoadingProgress(step, message) {
    const steps = ['step1', 'step2', 'step3'];
    const progressFill = document.getElementById('progressFill');
    
    // Update active step
    steps.forEach((stepId, index) => {
        const stepElement = document.getElementById(stepId);
        if (stepElement) {
            if (index < step) {
                stepElement.classList.add('active');
            } else {
                stepElement.classList.remove('active');
            }
        }
    });
    
    // Update progress bar
    if (progressFill) {
        const progress = (step / steps.length) * 100;
        progressFill.style.width = `${progress}%`;
    }
    
    // Update current step text
    const currentStepElement = document.getElementById(`step${step}`);
    if (currentStepElement && message) {
        currentStepElement.textContent = message;
    }
}

/**
 * Show error message
 */
function showError(message) {
    const errorElement = document.getElementById('errorMessage');
    errorElement.textContent = message;
    errorElement.style.display = 'block';
    
    setTimeout(() => {
        errorElement.style.display = 'none';
    }, 5000);
}

/**
 * Show alert
 */
function showAlert(message, type = 'success') {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type}`;
    alertDiv.textContent = message;
    
    // Insert at the top of main content
    const mainContent = document.querySelector('.main-content');
    mainContent.insertBefore(alertDiv, mainContent.firstChild);
    
    // Auto remove after 5 seconds
    setTimeout(() => {
        if (alertDiv.parentNode) {
            alertDiv.parentNode.removeChild(alertDiv);
        }
    }, 5000);
}

/**
 * Show section with robust display management
 */
function showSection(sectionName) {
    console.log('Showing section:', sectionName);
    
    // Ensure main container is visible
    const mainContainer = document.getElementById('mainContainer');
    if (mainContainer) {
        mainContainer.style.display = 'block';
        mainContainer.style.visibility = 'visible';
        mainContainer.style.opacity = '1';
    }
    
    // Hide all sections aggressively
    document.querySelectorAll('.content-section').forEach(section => {
        section.classList.remove('active');
        section.style.display = 'none';
    });
    
    // Remove active class from nav items
    document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
    });
    
    // Show selected section aggressively
    const targetSection = document.getElementById(sectionName);
    if (targetSection) {
        targetSection.classList.add('active');
        targetSection.style.display = 'block';
        targetSection.style.visibility = 'visible';
        targetSection.style.opacity = '1';
        console.log(`Section ${sectionName} should now be visible`);
    } else {
        console.error(`Section ${sectionName} not found!`);
        // Create fallback content
        createFallbackSection(sectionName);
        return;
    }
    
    // Add active class to nav item
    const navItem = document.querySelector(`[data-section="${sectionName}"]`);
    if (navItem) {
        navItem.classList.add('active');
    }
    
    // Load section-specific data
    try {
        switch (sectionName) {
            case 'dashboard':
                loadDashboardData();
                break;
            case 'pos':
                loadProducts();
                break;
            case 'products':
                loadProductsTable();
                break;
            case 'sales':
                loadSalesData();
                break;
            case 'reports':
                initializeReports();
                break;
            case 'employees':
                loadEmployeesTable();
                break;
            case 'admin':
                // Check if user has admin permissions
                if (currentUser && currentUser.role === 'Admin') {
                    // Load default admin tab (permissions)
                    switchAdminTab('permissions');
                } else {
                    showAlert('Access denied. Admin privileges required.', 'error');
                    showSection('dashboard');
                    return;
                }
                break;
            case 'settings':
                loadSettings();
                break;
        }
    } catch (error) {
        console.error(`Error loading data for section ${sectionName}:`, error);
    }
}

/**
 * Add product to cart
 */
function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    
    if (product.stock <= 0) {
        showAlert('Product is out of stock', 'warning');
        return;
    }
    
    const existingItem = cart.find(item => item.id === productId);
    
    if (existingItem) {
        if (existingItem.quantity < product.stock) {
            existingItem.quantity++;
        } else {
            showAlert('Not enough stock available', 'warning');
            return;
        }
    } else {
        cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            quantity: 1,
            stock: product.stock
        });
    }
    
    updateCartDisplay();
    animateAddToCart();
}

/**
 * Remove from cart
 */
function removeFromCart(productId) {
    cart = cart.filter(item => item.id !== productId);
    updateCartDisplay();
}

/**
 * Update cart quantity
 */
function updateCartQuantity(productId, change) {
    const item = cart.find(item => item.id === productId);
    if (!item) return;
    
    const newQuantity = item.quantity + change;
    
    if (newQuantity <= 0) {
        removeFromCart(productId);
    } else if (newQuantity <= item.stock) {
        item.quantity = newQuantity;
        updateCartDisplay();
    } else {
        showAlert('Not enough stock available', 'warning');
    }
}

/**
 * Update cart display
 */
function updateCartDisplay() {
    const cartItems = document.getElementById('cartItems');
    const checkoutBtn = document.getElementById('checkoutBtn');
    
    if (cart.length === 0) {
        cartItems.innerHTML = `
            <p style="text-align: center; color: #666; margin-top: 50px;">
                <i class="fas fa-shopping-cart" style="font-size: 48px; opacity: 0.3;"></i><br>
                Cart is empty
            </p>
        `;
        checkoutBtn.disabled = true;
    } else {
        cartItems.innerHTML = cart.map(item => `
            <div class="cart-item">
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">$${item.price.toFixed(2)} each</div>
                </div>
                <div class="quantity-controls">
                    <button class="qty-btn" onclick="updateCartQuantity('${item.id}', -1)">
                        <i class="fas fa-minus"></i>
                    </button>
                    <span style="margin: 0 10px; font-weight: 600;">${item.quantity}</span>

                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `).join('');
        
        checkoutBtn.disabled = false;
    }
    
    updateCartTotals();
}

/**
 * Update cart totals
 */
function updateCartTotals() {
    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const taxAmount = subtotal * currentTaxRate;
    const discount = 0; // Implement discount logic if needed
    const total = subtotal + taxAmount - discount;
    
    document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
    document.getElementById('taxAmount').textContent = `$${taxAmount.toFixed(2)}`;
    document.getElementById('discountAmount').textContent = `$${discount.toFixed(2)}`;
    document.getElementById('totalAmount').textContent = `$${total.toFixed(2)}`;
}

/**
 * Call server function
 */
async function callServerFunction(functionName, ...args) {
    try {
        // Since we're in Apps Script HTML environment, we use google.script.run
        return new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                [functionName](...args);
        });
    } catch (error) {
        console.error('Server call error:', error);
        throw error;
    }
}

/**
 * Helper Functions
 */
function findPeakHour(hourlyData) {
    if (!hourlyData || hourlyData.length === 0) {
        return '9:00-10:00';
    }
    let peakHour = hourlyData.reduce((max, hour) => 
        hour.revenue > max.revenue ? hour : max, hourlyData[0]);
    return peakHour ? peakHour.hour : '9:00-10:00';
}

// Render permissions matrix table
function renderPermissionsMatrix(permissions, roles) {
    const matrixContainer = document.getElementById('permissionsMatrix');
    
    let html = `
        <table class="permissions-table">
            <thead>
                <tr>
                    <th>Permission</th>
                    <th>Category</th>
                    <th>Description</th>
                    ${roles.map(role => `<th>${role}</th>`).join('')}
                </tr>
            </thead>
            <tbody>
    `;
    
    let currentCategory = '';
    permissions.forEach(permission => {
        // Add category header if changed
        if (permission.category !== currentCategory) {
            currentCategory = permission.category;
            html += `
                <tr class="permission-category">
                    <td colspan="${3 + roles.length}"><strong>${currentCategory}</strong></td>
                </tr>
            `;
        }
        
        html += `
            <tr>
                <td><strong>${permission.name}</strong></td>
                <td>${permission.category}</td>
                <td>${permission.description}</td>
                ${roles.map(role => `
                    <td>
                        <div class="permission-toggle ${permission.roles[role] ? 'enabled' : ''}" 
                             onclick="togglePermission('${role}', '${permission.id}', ${!permission.roles[role]})">
                        </div>
                    </td>
                `).join('')}
            </tr>
        `;
    });
    
    html += `
            </tbody>
        </table>
    `;
    
    matrixContainer.innerHTML = html;
}

        } else {
            showAlert('Failed to schedule backups', 'error');
        }
    } catch (error) {
        console.error('Error scheduling backups:', error);
        showAlert('Failed to schedule backups', 'error');
    }
}

function confirmSystemReset() {
    if (confirm('⚠️ WARNING: This will reset the entire system to default state. All data will be lost. Are you sure?')) {
        if (confirm('This action cannot be undone. Type "RESET" to confirm:') && prompt('Type RESET to confirm:') === 'RESET') {
            performSystemReset();
        }
    }
}

async function performSystemReset() {
    try {
        showLoading('Resetting system...');
        const result = await callServerFunction('resetPOSSystem');
        hideLoading();
        
        if (result) {
            showAlert('System reset successfully. Please refresh the page.', 'success');
            setTimeout(() => location.reload(), 3000);
        } else {
            showAlert('System reset failed', 'error');
        }
    } catch (error) {
        hideLoading();
        console.error('Error resetting system:', error);
        showAlert('Failed to reset system', 'error');
    }
}

// Load audit trail
async function loadAuditTrail() {
    try {
        const auditResults = document.getElementById('auditResults');
        auditResults.innerHTML = '<div class="loading-audit"><i class="fas fa-spinner fa-spin"></i> Loading audit trail...</div>';
        
        // Set default dates
        const today = new Date();
        const weekAgo = new Date(today.getTime() - (7 * 24 * 60 * 60 * 1000));
        
        document.getElementById('auditStartDate').value = weekAgo.toISOString().split('T')[0];
        document.getElementById('auditEndDate').value = today.toISOString().split('T')[0];
        
        const result = await callServerFunction('getTransactionLog', weekAgo, today);
        
        if (result.success) {
            renderAuditTrail(result.transactions);
        } else {
            auditResults.innerHTML = `<div class="error-message">Error loading audit trail: ${result.error}</div>`;
        }
    } catch (error) {
        console.error('Error loading audit trail:', error);
        document.getElementById('auditResults').innerHTML = '<div class="error-message">Failed to load audit trail</div>';
    }
}

// Render audit trail table
function renderAuditTrail(transactions) {
    const auditResults = document.getElementById('auditResults');
    
    if (!transactions || transactions.length === 0) {
        auditResults.innerHTML = '<div class="no-data">No audit records found for the selected criteria.</div>';
        return;
    }
    
    let html = `
        <table class="audit-table">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Action</th>
                    <th>User</th>
                    <th>Session</th>
                    <th>Details</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody>
    `;
    
    transactions.forEach(transaction => {
        const actionClass = transaction.action.toLowerCase().replace(' ', '');
        html += `
            <tr>
                <td>${new Date(transaction.timestamp).toLocaleString()}</td>
                <td><span class="audit-action ${actionClass}">${transaction.action}</span></td>
                <td>${transaction.user}</td>
                <td>${transaction.sessionId || '-'}</td>
                <td>${transaction.details || '-'}</td>
                <td>${transaction.amount ? '$' + parseFloat(transaction.amount).toFixed(2) : '-'}</td>
            </tr>
        `;
    });
    
    html += `
            </tbody>
        </table>
    `;
    
    auditResults.innerHTML = html;
}
